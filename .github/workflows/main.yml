name: Main CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

env:
  PIP_CACHE_DIR: "${{ github.workspace }}/.cache/pip"

jobs:
  check_changes:
    name: Check file changes
    runs-on: ubuntu-latest
    outputs:
      emsc_worker: ${{ steps.filter.outputs.emsc_worker }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            emsc_worker:
              - 'emsc_worker/**'
              - '.github/workflows/main.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/main.yml'

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          cd backend
          pytest tests/ -v

      - name: Send Telegram Notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            ICON="✅"
            STATUS_TEXT="Passed"
          else
            ICON="❌"
            STATUS_TEXT="Failed"
          fi
          MESSAGE="<b>${ICON} FonMaYang CI — ${STATUS_TEXT}</b>

          <b>Job:</b> <code>test</code>
          <b>Branch:</b> <code>${{ github.ref_name }}</code>
          <b>Commit:</b> <code>${{ github.sha }}</code> — ${{ github.event.head_commit.message }}
          <b>Pipeline:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Pipeline</a>"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.CI_TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${MESSAGE}"

  deploy_cloud_run:
    name: Deploy to Cloud Run
    needs: [test, check_changes]
    if: github.ref == 'refs/heads/main' && needs.check_changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ secrets.GCP_PROJECT_ID }}'

      - name: Deploy to Cloud Run
        run: |
          cd backend
          gcloud run deploy fontokmai-api \
            --source . \
            --service-account=cloud-run-runtime@fonmayang.iam.gserviceaccount.com \
            --region asia-southeast1 \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --timeout 60 \
            --service-min-instances 0 \
            --service-max-instances 2 \
            --concurrency 40 \
            --cpu-boost \
            --cpu-throttling \
            --set-env-vars "\
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }},\
          RAINBOW_API_KEY=${{ secrets.RAINBOW_API_KEY }},\
          TOMORROW_API_KEY=${{ secrets.TOMORROW_API_KEY }},\
          XWEATHER_CLIENT_ID=${{ secrets.XWEATHER_CLIENT_ID }},\
          XWEATHER_CLIENT_SECRET=${{ secrets.XWEATHER_CLIENT_SECRET }},\
          XWEATHER_ENABLED=${{ secrets.XWEATHER_ENABLED }},\
          DEVELOPER_CHAT_IDS=${{ secrets.DEVELOPER_CHAT_IDS }},\
          ENVIRONMENT=production,\
          CRON_SECRET=${{ secrets.CRON_SECRET }},\
          STORAGE_BACKEND=firestore,\
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }},\
          ALERT_COOLDOWN_MINUTES=${{ secrets.ALERT_COOLDOWN_MINUTES }},\
          RAIN_TRIGGER_THRESHOLD_MM=${{ secrets.RAIN_TRIGGER_THRESHOLD_MM }},\
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},\
          OCR_SPACE_API_KEY=${{ secrets.OCR_SPACE_API_KEY }},\
          WORKER_SECRET=${{ secrets.WORKER_SECRET }},\
          WORKER_BASE_URL=${{ secrets.WORKER_BASE_URL }},\
          INTERNAL_WEBHOOK_SECRET=${{ secrets.INTERNAL_WEBHOOK_SECRET }}"

      - name: Update Telegram Webhook
        run: |
          CLOUD_RUN_URL=$(gcloud run services describe fontokmai-api \
            --platform managed \
            --region asia-southeast1 \
            --format 'value(status.url)')
          echo "Updating Webhook to $CLOUD_RUN_URL/api/v1/telegram/webhook"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook" \
            -d url="${CLOUD_RUN_URL}/api/v1/telegram/webhook"

      - name: Update Cloud Scheduler Jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Updating Cloud Scheduler Jobs..."
          cd backend
          chmod +x scripts/setup_schedulers.sh
          ./scripts/setup_schedulers.sh

      - name: Send Telegram Notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            ICON="✅"
            STATUS_TEXT="Passed"
          else
            ICON="❌"
            STATUS_TEXT="Failed"
          fi
          MESSAGE="<b>${ICON} FonMaYang CI — ${STATUS_TEXT}</b>

          <b>Job:</b> <code>deploy_cloud_run</code>
          <b>Branch:</b> <code>${{ github.ref_name }}</code>
          <b>Commit:</b> <code>${{ github.sha }}</code>
          <b>Pipeline:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Pipeline</a>"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.CI_TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${MESSAGE}"

  deploy_emsc_worker:
    name: Deploy EMSC Worker
    needs: [test, check_changes]
    if: github.ref == 'refs/heads/main' && needs.check_changes.outputs.emsc_worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ secrets.GCP_PROJECT_ID }}'

      - name: Deploy EMSC Worker to VM
        run: |
          echo "Deploying EMSC worker to Compute Engine VM..."
          CLOUD_RUN_URL=$(gcloud run services describe fontokmai-api \
            --platform managed \
            --region asia-southeast1 \
            --format 'value(status.url)')
          echo "Cloud Run URL is $CLOUD_RUN_URL"
          echo "Copying files to VM..."
          
          gcloud compute ssh --zone "us-west1-a" "emsc-worker-vm" --project "${{ secrets.GCP_PROJECT_ID }}" --command="sudo mkdir -p /opt/fonmayang && sudo chown -R \$USER:\$USER /opt/fonmayang" --quiet
          
          gcloud compute scp --recurse --zone "us-west1-a" --project "${{ secrets.GCP_PROJECT_ID }}" ./emsc_worker emsc-worker-vm:/opt/fonmayang/ --quiet
          
          echo "Setting up environment and restarting service..."
          gcloud compute ssh --zone "us-west1-a" "emsc-worker-vm" --project "${{ secrets.GCP_PROJECT_ID }}" --command="
            cd /opt/fonmayang/emsc_worker
            
            echo \"FONMAYANG_API_URL=${CLOUD_RUN_URL}\" > .env
            echo \"INTERNAL_WEBHOOK_SECRET=${{ secrets.INTERNAL_WEBHOOK_SECRET }}\" >> .env
            echo \"EMSC_WS_URL=wss://www.seismicportal.eu/standing_order/websocket\" >> .env
            
            python3 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt
            
            sudo cp emsc_worker.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable emsc_worker.service
            sudo systemctl restart emsc_worker.service
          " --quiet

      - name: Send Telegram Notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            ICON="✅"
            STATUS_TEXT="Passed"
          else
            ICON="❌"
            STATUS_TEXT="Failed"
          fi
          MESSAGE="<b>${ICON} FonMaYang CI — ${STATUS_TEXT}</b>

          <b>Job:</b> <code>deploy_emsc_worker</code>
          <b>Branch:</b> <code>${{ github.ref_name }}</code>
          <b>Commit:</b> <code>${{ github.sha }}</code>
          <b>Pipeline:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Pipeline</a>"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.CI_TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${MESSAGE}"
