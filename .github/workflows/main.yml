name: Main CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
      - dev
  pull_request:

env:
  PIP_CACHE_DIR: "${{ github.workspace }}/.cache/pip"

jobs:
  # ------------------------------------------------------------------
  # Detect which files changed to skip unnecessary jobs
  # ------------------------------------------------------------------
  check_changes:
    name: Check file changes
    runs-on: ubuntu-latest
    outputs:
      emsc_worker: ${{ steps.filter.outputs.emsc_worker }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            emsc_worker:
              - 'emsc_worker/**'
              - '.github/workflows/main.yml'
            backend:
              - 'backend/app/**'
              - 'backend/tests/**'
              - 'backend/Dockerfile'
              - 'backend/requirements.txt'
              - 'backend/main.py'
              - '.github/workflows/main.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/main.yml'

  # ------------------------------------------------------------------
  # Backend Unit Tests
  # ------------------------------------------------------------------
  unit_tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Notify Telegram - Started
        run: |
          TEXT=$(printf "<b>🚀 FonMaYang CI — Job Started</b>\n\n<b>Job:</b> <code>unit_tests</code>\n<b>Branch:</b> <code>${{ github.ref_name }}</code>\n<b>Commit:</b> <code>${{ github.sha }}</code> — ${{ github.event.head_commit.message }}\n<b>Pipeline:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Pipeline</a>")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.CI_TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${TEXT}" || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          cd backend
          pytest tests/ -v

      - name: Notify Telegram - Result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then ICON="✅"; STATUS="Passed"; else ICON="❌"; STATUS="Failed"; fi
          TEXT=$(printf "<b>${ICON} FonMaYang CI — ${STATUS}</b>\n\n<b>Job:</b> <code>unit_tests</code>\n<b>Branch:</b> <code>${{ github.ref_name }}</code>\n<b>Pipeline:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Pipeline</a>")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.CI_TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${TEXT}"

  # ------------------------------------------------------------------
  # Frontend Unit Tests
  # ------------------------------------------------------------------
  test_frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Notify Telegram - Started
        run: |
          TEXT=$(printf "<b>🚀 FonMaYang CI — Job Started</b>\n\n<b>Job:</b> <code>test_frontend</code>\n<b>Branch:</b> <code>${{ github.ref_name }}</code>\n<b>Pipeline:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Pipeline</a>")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.CI_TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${TEXT}" || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: cd frontend && npm ci

      - name: Run Tests
        run: cd frontend && npm run test

      - name: Notify Telegram - Result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then ICON="✅"; STATUS="Passed"; else ICON="❌"; STATUS="Failed"; fi
          TEXT=$(printf "<b>${ICON} FonMaYang CI — ${STATUS}</b>\n\n<b>Job:</b> <code>test_frontend</code>\n<b>Branch:</b> <code>${{ github.ref_name }}</code>\n<b>Pipeline:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Pipeline</a>")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.CI_TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${TEXT}"

  # ------------------------------------------------------------------
  # Frontend E2E Tests (Playwright)
  # ------------------------------------------------------------------
  test_e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Notify Telegram - Started
        run: |
          TEXT=$(printf "<b>🚀 FonMaYang CI — Job Started</b>\n\n<b>Job:</b> <code>test_e2e</code>\n<b>Branch:</b> <code>${{ github.ref_name }}</code>\n<b>Pipeline:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Pipeline</a>")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.CI_TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${TEXT}" || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: cd frontend && npm ci

      - name: Install Playwright Browsers
        run: cd frontend && npx playwright install --with-deps

      - name: Run E2E Tests
        run: cd frontend && npm run test:e2e

      - name: Notify Telegram - Result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then ICON="✅"; STATUS="Passed"; else ICON="❌"; STATUS="Failed"; fi
          TEXT=$(printf "<b>${ICON} FonMaYang CI — ${STATUS}</b>\n\n<b>Job:</b> <code>test_e2e</code>\n<b>Branch:</b> <code>${{ github.ref_name }}</code>\n<b>Pipeline:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Pipeline</a>")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.CI_TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${TEXT}"

  # ------------------------------------------------------------------
  # Deploy to Cloud Run (prod / staging / dev)
  # ------------------------------------------------------------------
  deploy_cloud_run:
    name: Deploy to Cloud Run
    environment: ${{ github.ref_name }}
    needs: [unit_tests, test_frontend, check_changes]
    if: |
      (github.ref_name == 'main' || github.ref_name == 'staging' || github.ref_name == 'dev') &&
      needs.check_changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Environment & Service Name
        id: env_vars
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then
            echo "ENVIRONMENT=production"   >> $GITHUB_ENV
            echo "SERVICE_NAME=fontokmai-api" >> $GITHUB_ENV
          elif [ "$BRANCH" = "staging" ]; then
            echo "ENVIRONMENT=staging"              >> $GITHUB_ENV
            echo "SERVICE_NAME=fontokmai-api-staging" >> $GITHUB_ENV
          elif [ "$BRANCH" = "dev" ]; then
            echo "ENVIRONMENT=development"         >> $GITHUB_ENV
            echo "SERVICE_NAME=fontokmai-api-dev"  >> $GITHUB_ENV
          fi
          echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Notify Telegram - Started
        run: |
          TEXT=$(printf "<b>🚀 FonMaYang CI — Job Started</b>\n\n<b>Job:</b> <code>deploy_cloud_run</code>\n<b>Branch:</b> <code>${{ github.ref_name }}</code> → <code>${{ env.SERVICE_NAME }}</code> [<code>${{ env.ENVIRONMENT }}</code>]\n<b>Commit:</b> <code>${{ github.sha }}</code>\n<b>Pipeline:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Pipeline</a>")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.CI_TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${TEXT}" || true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ secrets.GCP_PROJECT_ID }}'

      - name: Deploy to Cloud Run
        run: |
          cd backend
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --service-account=cloud-run-runtime@fonmayang.iam.gserviceaccount.com \
            --region asia-southeast1 \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300 \
            --service-min-instances 0 \
            --service-max-instances 2 \
            --concurrency 40 \
            --cpu-boost \
            --cpu-throttling \
            --set-env-vars "\
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }},\
          RAINBOW_API_KEY=${{ secrets.RAINBOW_API_KEY }},\
          TOMORROW_API_KEY=${{ secrets.TOMORROW_API_KEY }},\
          XWEATHER_CLIENT_ID=${{ secrets.XWEATHER_CLIENT_ID }},\
          XWEATHER_CLIENT_SECRET=${{ secrets.XWEATHER_CLIENT_SECRET }},\
          XWEATHER_ENABLED=${{ secrets.XWEATHER_ENABLED }},\
          DEVELOPER_CHAT_IDS=${{ secrets.DEVELOPER_CHAT_IDS }},\
          CRON_SECRET=${{ secrets.CRON_SECRET }},\
          STORAGE_BACKEND=firestore,\
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }},\
          ALERT_COOLDOWN_MINUTES=${{ secrets.ALERT_COOLDOWN_MINUTES }},\
          RAIN_TRIGGER_THRESHOLD_MM=${{ secrets.RAIN_TRIGGER_THRESHOLD_MM }},\
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},\
          OCR_SPACE_API_KEY=${{ secrets.OCR_SPACE_API_KEY }},\
          WORKER_SECRET=${{ secrets.WORKER_SECRET }},\
          WORKER_BASE_URL=${{ secrets.WORKER_BASE_URL }},\
          INTERNAL_WEBHOOK_SECRET=${{ secrets.INTERNAL_WEBHOOK_SECRET }},\
          DATABASE_URL=${{ secrets.DATABASE_URL }},\
          ENVIRONMENT=${{ env.ENVIRONMENT }},\
          COMMIT_SHA=${{ env.COMMIT_SHA }}"

      - name: Update Telegram Webhook (prod only)
        if: github.ref_name == 'main'
        run: |
          CLOUD_RUN_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region asia-southeast1 \
            --format 'value(status.url)')
          echo "Updating Webhook to $CLOUD_RUN_URL/api/v1/telegram/webhook"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook" \
            -d url="${CLOUD_RUN_URL}/api/v1/telegram/webhook"

      - name: Update Cloud Scheduler Jobs (prod only)
        if: github.ref_name == 'main'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          cd backend
          chmod +x scripts/setup_schedulers.sh
          ./scripts/setup_schedulers.sh

      - name: Notify Telegram - Result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then ICON="✅"; STATUS="Passed"; else ICON="❌"; STATUS="Failed"; fi
          TEXT=$(printf "<b>${ICON} FonMaYang CI — ${STATUS}</b>\n\n<b>Job:</b> <code>deploy_cloud_run</code>\n<b>Branch:</b> <code>${{ github.ref_name }}</code> → <code>${{ env.SERVICE_NAME }}</code> [<code>${{ env.ENVIRONMENT }}</code>]\n<b>Pipeline:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Pipeline</a>")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.CI_TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${TEXT}"

  # ------------------------------------------------------------------
  # Deploy EMSC Worker (prod only)
  # ------------------------------------------------------------------
  deploy_emsc_worker:
    name: Deploy EMSC Worker
    needs: [unit_tests, check_changes]
    if: github.ref_name == 'main' && needs.check_changes.outputs.emsc_worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Notify Telegram - Started
        run: |
          TEXT=$(printf "<b>🚀 FonMaYang CI — Job Started</b>\n\n<b>Job:</b> <code>deploy_emsc_worker</code>\n<b>Branch:</b> <code>${{ github.ref_name }}</code>\n<b>Pipeline:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Pipeline</a>")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.CI_TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${TEXT}" || true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ secrets.GCP_PROJECT_ID }}'

      - name: Deploy EMSC Worker to VM
        run: |
          CLOUD_RUN_URL=$(gcloud run services describe fontokmai-api \
            --platform managed \
            --region asia-southeast1 \
            --format 'value(status.url)')
          gcloud compute ssh --zone "us-west1-a" "emsc-worker-vm" --project "${{ secrets.GCP_PROJECT_ID }}" --command="sudo mkdir -p /opt/fonmayang && sudo chown -R \$USER:\$USER /opt/fonmayang" --quiet
          gcloud compute scp --recurse --zone "us-west1-a" --project "${{ secrets.GCP_PROJECT_ID }}" ./emsc_worker emsc-worker-vm:/opt/fonmayang/ --quiet
          gcloud compute ssh --zone "us-west1-a" "emsc-worker-vm" --project "${{ secrets.GCP_PROJECT_ID }}" --command="
            cd /opt/fonmayang/emsc_worker
            echo \"FONMAYANG_API_URL=${CLOUD_RUN_URL}\" > .env
            echo \"INTERNAL_WEBHOOK_SECRET=${{ secrets.INTERNAL_WEBHOOK_SECRET }}\" >> .env
            echo \"EMSC_WS_URL=wss://www.seismicportal.eu/standing_order/websocket\" >> .env
            python3 -m venv venv && source venv/bin/activate && pip install -r requirements.txt
            sudo cp emsc_worker.service /etc/systemd/system/
            sudo systemctl daemon-reload && sudo systemctl enable emsc_worker.service && sudo systemctl restart emsc_worker.service
          " --quiet

      - name: Notify Telegram - Result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then ICON="✅"; STATUS="Passed"; else ICON="❌"; STATUS="Failed"; fi
          TEXT=$(printf "<b>${ICON} FonMaYang CI — ${STATUS}</b>\n\n<b>Job:</b> <code>deploy_emsc_worker</code>\n<b>Branch:</b> <code>${{ github.ref_name }}</code>\n<b>Pipeline:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Pipeline</a>")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.CI_TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${TEXT}"
