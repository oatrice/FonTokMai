name: Cleanup Artifact Registry

on:
  schedule:
    - cron: '0 0 * * 0' # Run every Sunday at midnight
  workflow_dispatch:

jobs:
  cleanup_artifact_registry:
    name: Cleanup Artifact Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ secrets.GCP_PROJECT_ID }}'

      - name: Run Cleanup Script
        run: |
          cd backend
          chmod +x scripts/cleanup_artifact_registry.sh
          ./scripts/cleanup_artifact_registry.sh

      - name: Send Telegram Notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            ICON="✅"
            STATUS_TEXT="Passed"
          else
            ICON="❌"
            STATUS_TEXT="Failed"
          fi
          MESSAGE="<b>${ICON} FonMaYang CI — ${STATUS_TEXT}</b>

          <b>Job:</b> <code>cleanup_artifact_registry</code>
          <b>Trigger:</b> <code>${{ github.event_name }}</code>
          <b>Pipeline:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Pipeline</a>"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.CI_TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${MESSAGE}"
