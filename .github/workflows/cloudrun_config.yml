name: Cloud Run Config Update

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment to configure'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  cloudrun_config_only:
    name: Apply Cloud Run Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Branch from Environment
        id: resolve_branch
        run: |
          ENV="${{ inputs.environment }}"
          if [ "$ENV" = "production" ]; then
            echo "BRANCH=main" >> $GITHUB_ENV
          elif [ "$ENV" = "staging" ]; then
            echo "BRANCH=staging" >> $GITHUB_ENV
          else
            echo "BRANCH=dev" >> $GITHUB_ENV
          fi

      - name: Notify Telegram - Started
        run: |
          TEXT=$(printf "<b>🚀 FonMaYang CI — Job Started</b>\n\n<b>Job:</b> <code>cloudrun_config_only</code>\n<b>Target Env:</b> <code>${{ inputs.environment }}</code>\n<b>Pipeline:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Pipeline</a>")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.CI_TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${TEXT}" || true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ secrets.GCP_PROJECT_ID }}'

      - name: Apply Cloud Run Config
        env:
          CI: "true"
          CI_COMMIT_BRANCH: ${{ env.BRANCH }}
        run: |
          cd backend
          chmod +x deploy/apply_cloudrun_config.sh
          ./deploy/apply_cloudrun_config.sh

      - name: Notify Telegram - Result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then ICON="✅"; STATUS="Passed"; else ICON="❌"; STATUS="Failed"; fi
          TEXT=$(printf "<b>${ICON} FonMaYang CI — ${STATUS}</b>\n\n<b>Job:</b> <code>cloudrun_config_only</code>\n<b>Target Env:</b> <code>${{ inputs.environment }}</code>\n<b>Pipeline:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Pipeline</a>")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.CI_TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${TEXT}"
