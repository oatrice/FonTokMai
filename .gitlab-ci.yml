stages:
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

# --- Shared Telegram Notification Template ---
.telegram_notify: &telegram_notify
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        ICON="✅"
        STATUS_TEXT="Passed"
      else
        ICON="❌"
        STATUS_TEXT="Failed"
      fi
      MESSAGE="<b>${ICON} FonMaYang CI — ${STATUS_TEXT}</b>

      <b>Job:</b> <code>${CI_JOB_NAME}</code>
      <b>Branch:</b> <code>${CI_COMMIT_REF_NAME}</code>
      <b>Commit:</b> <code>${CI_COMMIT_SHORT_SHA}</code> — ${CI_COMMIT_TITLE}
      <b>Pipeline:</b> <a href=\"${CI_PIPELINE_URL}\">View Pipeline</a>"

      curl -s -X POST "https://api.telegram.org/bot${CI_TELEGRAM_BOT_TOKEN}/sendMessage" \
        -d chat_id="${TELEGRAM_CHAT_ID}" \
        -d parse_mode="HTML" \
        -d disable_web_page_preview="true" \
        --data-urlencode "text=${MESSAGE}"

unit_tests:
  stage: test
  image: python:3.11-slim
  before_script:
    - apt-get update && apt-get install -y curl
    - cd backend
    - pip install -r requirements.txt
  script:
    - pytest tests/ -v
  <<: *telegram_notify
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

deploy_cloud_run:
  stage: deploy
  image: google/cloud-sdk:alpine
  script:
    - echo "Deploying to Google Cloud Run..."
    # Note: Requires GCP_PROJECT_ID and GCP_SA_KEY (Base64 encoded Service Account JSON) set in GitLab CI/CD Variables
    - echo "$GCP_SA_KEY" | base64 -d > /tmp/gcp-sa-key.json
    - gcloud auth activate-service-account --key-file=/tmp/gcp-sa-key.json
    - gcloud config set project $GCP_PROJECT_ID
    # Deploy to Cloud Run
    - cd backend
    - gcloud run deploy fontokmai-api --source . --region us-central1 --allow-unauthenticated --set-env-vars TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN,RAINBOW_API_KEY=$RAINBOW_API_KEY,DEVELOPER_CHAT_IDS=$DEVELOPER_CHAT_IDS,ENVIRONMENT=production,CRON_SECRET=$CRON_SECRET
    # Update Telegram Webhook
    - CLOUD_RUN_URL=$(gcloud run services describe fontokmai-api --platform managed --region us-central1 --format 'value(status.url)')
    - echo "Updating Webhook to $CLOUD_RUN_URL/api/v1/telegram/webhook"
    - curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" -d url="${CLOUD_RUN_URL}/api/v1/telegram/webhook"
  <<: *telegram_notify
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
