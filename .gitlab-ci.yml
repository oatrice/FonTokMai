stages:
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

# --- Shared Telegram Notification Template ---
.telegram_notify: &telegram_notify
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        ICON="✅"
        STATUS_TEXT="Passed"
      else
        ICON="❌"
        STATUS_TEXT="Failed"
      fi
      MESSAGE="<b>${ICON} FonMaYang CI — ${STATUS_TEXT}</b>

      <b>Job:</b> <code>${CI_JOB_NAME}</code>
      <b>Branch:</b> <code>${CI_COMMIT_REF_NAME}</code>
      <b>Commit:</b> <code>${CI_COMMIT_SHORT_SHA}</code> — ${CI_COMMIT_TITLE}
      <b>Pipeline:</b> <a href=\"${CI_PIPELINE_URL}\">View Pipeline</a>"

      curl -s -X POST "https://api.telegram.org/bot${CI_TELEGRAM_BOT_TOKEN}/sendMessage" \
        -d chat_id="${TELEGRAM_CHAT_ID}" \
        -d parse_mode="HTML" \
        -d disable_web_page_preview="true" \
        --data-urlencode "text=${MESSAGE}"

unit_tests:
  stage: test
  image: python:3.11-slim
  before_script:
    - apt-get update && apt-get install -y curl
    - cd backend
    - pip install -r requirements.txt
  script:
    - pytest tests/ -v
  <<: *telegram_notify
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

deploy_cloud_run:
  stage: deploy
  image: google/cloud-sdk:alpine
  script:
    - echo "Deploying to Google Cloud Run..."
    # Note: Requires GCP_PROJECT_ID and GCP_SA_KEY (Base64 encoded Service Account JSON) set in GitLab CI/CD Variables
    - echo "$GCP_SA_KEY" | base64 -d > /tmp/gcp-sa-key.json
    - gcloud auth activate-service-account --key-file=/tmp/gcp-sa-key.json
    - gcloud config set project $GCP_PROJECT_ID
    # Deploy to Cloud Run
    - cd backend
    - |
      gcloud run deploy fontokmai-api \
        --source . \
        --service-account=cloud-run-runtime@fonmayang.iam.gserviceaccount.com \
        --region asia-southeast1 \
        --allow-unauthenticated \
        --memory 512Mi \
        --cpu 1 \
        --timeout 60 \
        --service-min-instances 0 \
        --service-max-instances 2 \
        --concurrency 40 \
        --cpu-boost \
        --set-env-vars "\
      TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN},\
      RAINBOW_API_KEY=${RAINBOW_API_KEY},\
      TOMORROW_API_KEY=${TOMORROW_API_KEY},\
      XWEATHER_CLIENT_ID=${XWEATHER_CLIENT_ID},\
      XWEATHER_CLIENT_SECRET=${XWEATHER_CLIENT_SECRET},\
      XWEATHER_ENABLED=${XWEATHER_ENABLED},\
      DEVELOPER_CHAT_IDS=${DEVELOPER_CHAT_IDS},\
      ENVIRONMENT=production,\
      CRON_SECRET=${CRON_SECRET},\
      STORAGE_BACKEND=firestore,\
      FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET},\
      ALERT_COOLDOWN_MINUTES=${ALERT_COOLDOWN_MINUTES},\
      RAIN_TRIGGER_THRESHOLD_MM=${RAIN_TRIGGER_THRESHOLD_MM},\
      GEMINI_API_KEY=${GEMINI_API_KEY},\
      OCR_SPACE_API_KEY=${OCR_SPACE_API_KEY},\
      WORKER_SECRET=${WORKER_SECRET},\
      WORKER_BASE_URL=${WORKER_BASE_URL},\
      INTERNAL_WEBHOOK_SECRET=${INTERNAL_WEBHOOK_SECRET}"
    # Update Telegram Webhook
    - |
      CLOUD_RUN_URL=$(gcloud run services describe fontokmai-api \
        --platform managed \
        --region asia-southeast1 \
        --format 'value(status.url)')
    - echo "Updating Webhook to $CLOUD_RUN_URL/api/v1/telegram/webhook"
    - |
      curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
        -d url="${CLOUD_RUN_URL}/api/v1/telegram/webhook"
    # Update Cloud Scheduler Jobs
    - echo "Updating Cloud Scheduler Jobs..."
    - chmod +x scripts/setup_schedulers.sh
    - ./scripts/setup_schedulers.sh

  <<: *telegram_notify
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

cleanup_artifact_registry:
  stage: deploy
  image: google/cloud-sdk:alpine
  script:
    - echo "Cleaning up old Artifact Registry images..."
    - echo "$GCP_SA_KEY" | base64 -d > /tmp/gcp-sa-key.json
    - gcloud auth activate-service-account --key-file=/tmp/gcp-sa-key.json
    - gcloud config set project $GCP_PROJECT_ID
    - cd backend
    - chmod +x scripts/cleanup_artifact_registry.sh
    - ./scripts/cleanup_artifact_registry.sh
  <<: *telegram_notify
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

