stages:
  - test
  - config
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

# --- YAML Anchor for Start Notification ---
.notify_start_script: &notify_start_script
  - |
    MESSAGE="<b>🚀 FonMaYang CI — Job Started</b>

    <b>Job:</b> <code>${CI_JOB_NAME}</code>
    <b>Branch:</b> <code>${CI_COMMIT_REF_NAME}</code>
    <b>Commit:</b> <code>${CI_COMMIT_SHORT_SHA}</code> — ${CI_COMMIT_TITLE}
    <b>Pipeline:</b> <a href=\"${CI_PIPELINE_URL}\">View Pipeline</a>"

    curl -s -X POST "https://api.telegram.org/bot${CI_TELEGRAM_BOT_TOKEN}/sendMessage" \
      -d chat_id="${TELEGRAM_CHAT_ID}" \
      -d parse_mode="HTML" \
      -d disable_web_page_preview="true" \
      --data-urlencode "text=${MESSAGE}" || true

# --- Shared Telegram Notification Template ---
.telegram_notify:
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        ICON="✅"
        STATUS_TEXT="Passed"
      else
        ICON="❌"
        STATUS_TEXT="Failed"
      fi
      MESSAGE="<b>${ICON} FonMaYang CI — ${STATUS_TEXT}</b>

      <b>Job:</b> <code>${CI_JOB_NAME}</code>
      <b>Branch:</b> <code>${CI_COMMIT_REF_NAME}</code>
      <b>Commit:</b> <code>${CI_COMMIT_SHORT_SHA}</code> — ${CI_COMMIT_TITLE}
      <b>Pipeline:</b> <a href=\"${CI_PIPELINE_URL}\">View Pipeline</a>"

      curl -s -X POST "https://api.telegram.org/bot${CI_TELEGRAM_BOT_TOKEN}/sendMessage" \
        -d chat_id="${TELEGRAM_CHAT_ID}" \
        -d parse_mode="HTML" \
        -d disable_web_page_preview="true" \
        --data-urlencode "text=${MESSAGE}"

.gcloud_auth:
  before_script:
    - *notify_start_script
    - echo "$GCP_SA_KEY" | base64 -d > /tmp/gcp-sa-key.json
    - gcloud auth activate-service-account --key-file=/tmp/gcp-sa-key.json
    - gcloud config set project "$GCP_PROJECT_ID"

cloudrun_config_only:
  stage: config
  image: google/cloud-sdk:alpine
  extends:
    - .gcloud_auth
    - .telegram_notify
  script:
    - cd backend
    - chmod +x deploy/apply_cloudrun_config.sh
    - ./deploy/apply_cloudrun_config.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/deploy/cloudrun.env
      when: manual

deploy_cloud_run:
  stage: deploy
  image: google/cloud-sdk:alpine
  extends:
    - .gcloud_auth
    - .telegram_notify
  script:
    - cd backend
    - chmod +x deploy/deploy_cloudrun.sh
    - ./deploy/deploy_cloudrun.sh
    - |
      CLOUD_RUN_URL=$(gcloud run services describe "$(grep '^CLOUD_RUN_SERVICE=' deploy/cloudrun.env | cut -d= -f2)" \
        --platform managed \
        --region "$(grep '^CLOUD_RUN_REGION=' deploy/cloudrun.env | cut -d= -f2)" \
        --format 'value(status.url)')
    - echo "Updating Webhook to $CLOUD_RUN_URL/api/v1/telegram/webhook"
    - |
      curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
        -d url="${CLOUD_RUN_URL}/api/v1/telegram/webhook"
    - echo "Updating Cloud Scheduler Jobs..."
    - chmod +x scripts/setup_schedulers.sh
    - ./scripts/setup_schedulers.sh
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/app/**/*
        - backend/tests/**/*
        - backend/Dockerfile
        - backend/requirements.txt
        - backend/main.py

unit_tests:
  stage: test
  image: python:3.11-slim
  extends:
    - .telegram_notify
  before_script:
    - apt-get update && apt-get install -y curl
    - *notify_start_script
    - cd backend
    - pip install --default-timeout=100 -r requirements.txt
  script:
    - pytest tests/ -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

cleanup_artifact_registry:
  stage: deploy
  image: google/cloud-sdk:alpine
  extends:
    - .gcloud_auth
    - .telegram_notify
  script:
    - echo "Cleaning up old Artifact Registry images..."
    - cd backend
    - chmod +x scripts/cleanup_artifact_registry.sh
    - ./scripts/cleanup_artifact_registry.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

deploy_emsc_worker:
  stage: deploy
  image: google/cloud-sdk:alpine
  extends:
    - .gcloud_auth
    - .telegram_notify
  script:
    - echo "Deploying EMSC worker to Compute Engine VM..."
    - |
      CLOUD_RUN_URL=$(gcloud run services describe fontokmai-api \
        --platform managed \
        --region asia-southeast1 \
        --format 'value(status.url)')
    - echo "Cloud Run URL is $CLOUD_RUN_URL"
    - echo "Copying files to VM..."
    - gcloud compute ssh --zone "us-west1-a" "emsc-worker-vm" --project "$GCP_PROJECT_ID" --command="sudo mkdir -p /opt/fonmayang && sudo chown -R \$USER:\$USER /opt/fonmayang" --quiet
    - gcloud compute scp --recurse --zone "us-west1-a" --project "$GCP_PROJECT_ID" ./emsc_worker emsc-worker-vm:/opt/fonmayang/ --quiet
    - echo "Setting up environment and restarting service..."
    - |
      gcloud compute ssh --zone "us-west1-a" "emsc-worker-vm" --project "$GCP_PROJECT_ID" --command="
        cd /opt/fonmayang/emsc_worker
        
        echo \"FONMAYANG_API_URL=${CLOUD_RUN_URL}\" > .env
        echo \"INTERNAL_WEBHOOK_SECRET=${INTERNAL_WEBHOOK_SECRET}\" >> .env
        echo \"EMSC_WS_URL=wss://www.seismicportal.eu/standing_order/websocket\" >> .env
        
        python3 -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        
        sudo cp emsc_worker.service /etc/systemd/system/
        sudo systemctl daemon-reload
        sudo systemctl enable emsc_worker.service
        sudo systemctl restart emsc_worker.service
      " --quiet
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - emsc_worker/**/*
