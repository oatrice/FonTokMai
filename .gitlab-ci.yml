stages:
  - verify
  - test
  - config
  - deploy


variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"


cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

# --- YAML Anchor for Start Notification ---
.notify_start_script: &notify_start_script
  - |
    MESSAGE="<b>🚀 FonMaYang CI — Job Started</b>

    <b>Job:</b> <code>${CI_JOB_NAME}</code>
    <b>Branch:</b> <code>${CI_COMMIT_REF_NAME}</code>
    <b>Commit:</b> <code>${CI_COMMIT_SHORT_SHA}</code> — ${CI_COMMIT_TITLE}
    <b>Pipeline:</b> <a href=\"${CI_PIPELINE_URL}\">View Pipeline</a>"

    curl -s -X POST "https://api.telegram.org/bot${CI_TELEGRAM_BOT_TOKEN}/sendMessage" \
      -d chat_id="${TELEGRAM_CHAT_ID}" \
      -d parse_mode="HTML" \
      -d disable_web_page_preview="true" \
      --data-urlencode "text=${MESSAGE}" || true

# --- Shared Telegram Notification Template ---
.telegram_notify:
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        ICON="✅"
        STATUS_TEXT="Passed"
      else
        ICON="❌"
        STATUS_TEXT="Failed"
      fi
      MESSAGE="<b>${ICON} FonMaYang CI — ${STATUS_TEXT}</b>

      <b>Job:</b> <code>${CI_JOB_NAME}</code>
      <b>Branch:</b> <code>${CI_COMMIT_REF_NAME}</code>
      <b>Commit:</b> <code>${CI_COMMIT_SHORT_SHA}</code> — ${CI_COMMIT_TITLE}
      <b>Pipeline:</b> <a href=\"${CI_PIPELINE_URL}\">View Pipeline</a>"

      curl -s -X POST "https://api.telegram.org/bot${CI_TELEGRAM_BOT_TOKEN}/sendMessage" \
        -d chat_id="${TELEGRAM_CHAT_ID}" \
        -d parse_mode="HTML" \
        -d disable_web_page_preview="true" \
        --data-urlencode "text=${MESSAGE}"

check_docs_updated:
  stage: verify
  image: alpine:latest
  extends:
    - .telegram_notify
  before_script:
    - apk add --no-cache git curl bash
    - *notify_start_script
  script:
    - echo "🔍 Checking documentation updates and commit ordering relative to target branch..."
    - TARGET_BRANCH=${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-dev}
    - git fetch origin $TARGET_BRANCH:$TARGET_BRANCH || git fetch origin main:main || true
    - CHANGED_FILES=$(git diff --name-only origin/$TARGET_BRANCH...HEAD 2>/dev/null || git diff --name-only $TARGET_BRANCH...HEAD 2>/dev/null || git diff --name-only HEAD~5)
    - echo "Changed files in this MR/branch:"
    - echo "$CHANGED_FILES"
    - MISSING=0
    - |
      if ! echo "$CHANGED_FILES" | grep -q "^CHANGELOG\.md$"; then
        echo "❌ ERROR: CHANGELOG.md must be updated before merging into $TARGET_BRANCH!"
        MISSING=1
      else
        echo "✅ CHANGELOG.md is updated."
      fi
    - |
      if ! echo "$CHANGED_FILES" | grep -q "^VERSION$"; then
        echo "❌ ERROR: VERSION must be updated before merging into $TARGET_BRANCH!"
        MISSING=1
      else
        echo "✅ VERSION is updated."
      fi
    - |
      if ! echo "$CHANGED_FILES" | grep -q "^README\.md$"; then
        echo "ℹ️ INFO: README.md is unchanged (optional)."
      else
        echo "✅ README.md is updated."
      fi
    - |
      if [ "$MISSING" = "1" ]; then
        echo "💥 Documentation check failed. Merge request cannot proceed without CHANGELOG.md and VERSION updates!"
        exit 1
      fi
    - echo "⏱️ Checking commit ordering (ensuring docs were not updated prior to subsequent code changes)..."
    - |
      LAST_CODE_COMMIT=$(git log -n 1 --format="%H" origin/$TARGET_BRANCH..HEAD -- . ':!CHANGELOG.md' ':!VERSION' ':!README.md' ':!.gitlab-ci.yml' ':!manual_verification.md' ':!walkthrough.md' 2>/dev/null || git log -n 1 --format="%H" HEAD~5..HEAD -- . ':!CHANGELOG.md' ':!VERSION' ':!README.md' ':!.gitlab-ci.yml' ':!manual_verification.md' ':!walkthrough.md')
      LAST_DOC_COMMIT=$(git log -n 1 --format="%H" origin/$TARGET_BRANCH..HEAD -- CHANGELOG.md VERSION 2>/dev/null || git log -n 1 --format="%H" HEAD~5..HEAD -- CHANGELOG.md VERSION)
      
      if [ -n "$LAST_CODE_COMMIT" ] && [ -n "$LAST_DOC_COMMIT" ]; then
        CODE_TIME=$(git log -1 --format="%ct" $LAST_CODE_COMMIT)
        DOC_TIME=$(git log -1 --format="%ct" $LAST_DOC_COMMIT)
        
        echo "   Last Code Commit: $LAST_CODE_COMMIT (Timestamp: $CODE_TIME)"
        echo "   Last Doc Commit:  $LAST_DOC_COMMIT (Timestamp: $DOC_TIME)"
        
        if [ "$DOC_TIME" -lt "$CODE_TIME" ]; then
          echo "❌ ERROR: Code was modified AFTER the last documentation update!"
          echo "   Code commit: $LAST_CODE_COMMIT ($(git log -1 --format='%s' $LAST_CODE_COMMIT))"
          echo "   Doc commit:  $LAST_DOC_COMMIT ($(git log -1 --format='%s' $LAST_DOC_COMMIT))"
          echo "💡 Please update CHANGELOG.md or VERSION in your latest commit to reflect subsequent code changes."
          exit 1
        fi
      fi
    - echo "🎉 All required documentation files are updated and synchronized with the latest code changes!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging")

.gcloud_auth:
  before_script:
    - *notify_start_script
    - echo "$GCP_SA_KEY" | base64 -d > /tmp/gcp-sa-key.json
    - gcloud auth activate-service-account --key-file=/tmp/gcp-sa-key.json
    - gcloud config set project "$GCP_PROJECT_ID"

cloudrun_config_only:
  stage: config
  image: google/cloud-sdk:alpine
  extends:
    - .gcloud_auth
    - .telegram_notify
  script:
    - cd backend
    - chmod +x deploy/apply_cloudrun_config.sh
    - ./deploy/apply_cloudrun_config.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "dev"
      changes:
        - backend/deploy/cloudrun.env
      when: manual

deploy_cloud_run:
  stage: deploy
  environment:
    name: $CI_COMMIT_BRANCH
  image: google/cloud-sdk:alpine
  extends:
    - .gcloud_auth
    - .telegram_notify
  script:
    - cd backend
    - chmod +x deploy/deploy_cloudrun.sh
    - ./deploy/deploy_cloudrun.sh
    - |
      CLOUD_RUN_URL=$(gcloud run services describe "$(grep '^CLOUD_RUN_SERVICE=' deploy/cloudrun.env | cut -d= -f2)" \
        --platform managed \
        --region "$(grep '^CLOUD_RUN_REGION=' deploy/cloudrun.env | cut -d= -f2)" \
        --format 'value(status.url)')
    - echo "Updating Webhook to $CLOUD_RUN_URL/api/v1/telegram/webhook"
    - |
      curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
        -d url="${CLOUD_RUN_URL}/api/v1/telegram/webhook"
    - echo "Updating Cloud Scheduler Jobs..."
    - chmod +x scripts/setup_schedulers.sh
    - ./scripts/setup_schedulers.sh
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "dev"
      changes:
        - backend/app/**/*
        - backend/tests/**/*
        - backend/Dockerfile
        - backend/requirements.txt
        - backend/main.py

unit_tests:
  stage: test
  image: python:3.11-slim
  extends:
    - .telegram_notify
  before_script:
    - *notify_start_script
    - apt-get update && apt-get install -y curl
    - cd backend
    - pip install --default-timeout=100 -r requirements.txt
  script:
    - pytest tests/ -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "dev"

test_frontend:
  stage: test
  image: node:20-alpine
  extends:
    - .telegram_notify
  before_script:
    - *notify_start_script
    - apk add --no-cache curl
    - cd frontend
    - npm ci
  script:
    - npm run test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "dev"

test_e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.61.1-noble
  extends:
    - .telegram_notify
  before_script:
    - *notify_start_script
    - apt-get update && apt-get install -y curl
    - cd frontend
    - npm ci
  script:
    - npm run test:e2e
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "dev"

cleanup_artifact_registry:
  stage: deploy
  image: google/cloud-sdk:alpine
  extends:
    - .gcloud_auth
    - .telegram_notify
  script:
    - echo "Cleaning up old Artifact Registry images..."
    - cd backend
    - chmod +x scripts/cleanup_artifact_registry.sh
    - ./scripts/cleanup_artifact_registry.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

deploy_emsc_worker:
  stage: deploy
  image: google/cloud-sdk:alpine
  extends:
    - .gcloud_auth
    - .telegram_notify
  script:
    - echo "Deploying EMSC worker to Compute Engine VM..."
    - |
      CLOUD_RUN_URL=$(gcloud run services describe fontokmai-api \
        --platform managed \
        --region asia-southeast1 \
        --format 'value(status.url)')
    - echo "Cloud Run URL is $CLOUD_RUN_URL"
    - echo "Copying files to VM..."
    - gcloud compute ssh --zone "us-west1-a" "emsc-worker-vm" --project "$GCP_PROJECT_ID" --command="sudo mkdir -p /opt/fonmayang && sudo chown -R \$USER:\$USER /opt/fonmayang" --quiet
    - gcloud compute scp --recurse --zone "us-west1-a" --project "$GCP_PROJECT_ID" ./emsc_worker emsc-worker-vm:/opt/fonmayang/ --quiet
    - echo "Setting up environment and restarting service..."
    - |
      gcloud compute ssh --zone "us-west1-a" "emsc-worker-vm" --project "$GCP_PROJECT_ID" --command="
        cd /opt/fonmayang/emsc_worker
        
        echo \"FONMAYANG_API_URL=${CLOUD_RUN_URL}\" > .env
        echo \"INTERNAL_WEBHOOK_SECRET=${INTERNAL_WEBHOOK_SECRET}\" >> .env
        echo \"EMSC_WS_URL=wss://www.seismicportal.eu/standing_order/websocket\" >> .env
        
        python3 -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        
        sudo cp emsc_worker.service /etc/systemd/system/
        sudo systemctl daemon-reload
        sudo systemctl enable emsc_worker.service
        sudo systemctl restart emsc_worker.service
      " --quiet
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - emsc_worker/**/*
